<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 — 팜싱크 FarmSync</title>
<link rel="stylesheet" href="assets/css/app.css?v=9">
<script src="assets/js/resilient.js?v=22"></script>
</head>
<body>

<div class="authwrap">
  <div class="authcard">
    <div class="brandline">팜싱크 FarmSync</div>
    <h1>로그인</h1>
    <p class="sub">납품 협의 대화를 이어가려면 로그인하세요.</p>

    <div class="notice bad" id="notice"></div>

    <form id="loginForm" novalidate>
      <div class="fld">
        <label class="f" for="login_id">아이디</label>
        <input type="text" id="login_id" name="login_id" autocomplete="username" placeholder="가입할 때 만든 아이디">
        <div class="err" id="e_login_id"></div>
      </div>
      <div class="fld">
        <label class="f" for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호">
        <div class="err" id="e_password"></div>
      </div>
      <button class="btn solid" type="submit" id="submitBtn" style="width:100%;margin-top:6px">로그인</button>
    </form>

    <div class="authfoot">
      아직 계정이 없으신가요? <a href="/signup">회원가입</a><br>
      <span style="display:inline-block;margin-top:10px"><a href="/" style="color:var(--ink-3)">← 메인으로</a></span>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var notice = document.getElementById("notice");
  var btn = document.getElementById("submitBtn");

  function show(msg) { notice.textContent = msg; notice.classList.add("show"); }
  function clearErrors() {
    ["login_id", "password"].forEach(function (k) {
      var e = document.getElementById("e_" + k);
      if (e) e.textContent = "";
    });
  }

  document.getElementById("loginForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    clearErrors();
    notice.classList.remove("show");

    var payload = {
      login_id: document.getElementById("login_id").value.trim(),
      password: document.getElementById("password").value
    };
    if (!payload.login_id) { document.getElementById("e_login_id").textContent = "아이디를 입력하세요"; return; }
    if (!payload.password) { document.getElementById("e_password").textContent = "비밀번호를 입력하세요"; return; }

    btn.disabled = true;
    btn.textContent = "확인 중…";

    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j.ok) {
          show(res.j.detail || "로그인에 실패했습니다");
          btn.disabled = false;
          btn.textContent = "로그인";
          return;
        }
        location.href = res.j.next || "/app";
      })
      .catch(function () {
        show("서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.");
        btn.disabled = false;
        btn.textContent = "로그인";
      });
  });
})();
</script>
</body>
</html>
