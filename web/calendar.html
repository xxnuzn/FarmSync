<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일정 — 팜싱크 FarmSync</title>
<link rel="stylesheet" href="assets/css/app.css?v=22">
<script src="assets/js/resilient.js?v=22"></script>
</head>
<body>

<header class="topbar">
  <a class="mark" href="/friends">팜싱크</a>
  <span class="pill" id="mePill">—</span>
  <span class="sp"></span>
  <a class="lk" href="/friends">친구 목록</a>
  <a class="lk" href="/chat">대화</a>
  <a class="lk" href="/calendar" style="color:#fff;font-weight:600">캘린더</a>
  <a class="lk" href="#" id="logout">로그아웃</a>
</header>

<div class="notice bad" id="notice" style="margin:14px 22px 0"></div>

<div class="wrap">
  <div class="calwrap">

    <section class="card">
      <div class="calbar">
        <button class="btn line sm" id="prevM">◀</button>
        <span class="mtitle" id="mTitle">—</span>
        <button class="btn line sm" id="nextM">▶</button>
        <span class="sp"></span>
        <button class="btn line sm" id="todayBtn">오늘</button>
      </div>
      <div class="grid7" id="dowRow"></div>
      <div class="grid7" id="monthGrid"></div>
      <div class="bd" style="border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap">
        <span style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3)">
          <i style="width:10px;height:10px;border-radius:3px;background:var(--signal);display:inline-block"></i>내 개인 일정 (나만 확인)
        </span>
        <span style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3)">
          <i style="width:10px;height:10px;border-radius:3px;background:#e0761d;display:inline-block"></i>대화방 공유 일정 (상대와 함께 확인)
        </span>
      </div>
    </section>

    <div style="display:flex;flex-direction:column;gap:18px">
      <section class="card">
        <h2>일정 추가 <span class="tag">개인 · 공유</span></h2>
        <div class="bd">
          <div class="fld">
            <label class="f" for="evTitle">제목 <em>*</em></label>
            <input type="text" id="evTitle" placeholder="예) 상추 300kg 출고">
            <div class="err" id="e_title"></div>
          </div>
          <div class="row2">
            <div class="fld">
              <label class="f" for="evDate">날짜 <em>*</em></label>
              <input type="date" id="evDate">
            </div>
            <div class="fld">
              <label class="f" for="evTime">시간</label>
              <input type="time" id="evTime" value="09:00">
            </div>
          </div>
          <div class="fld">
            <label class="f" for="evNote">메모</label>
            <input type="text" id="evNote" placeholder="예) 3,900원/kg · 차량 배차 필요">
          </div>
          <div class="fld">
            <label class="f">공개 범위</label>
            <div class="roles" style="margin-bottom:10px">
              <div class="role on" id="scopePersonal" data-scope="personal">
                <b>개인 일정</b>
                <span>나만 볼 수 있습니다. 상대에게는 보이지 않습니다</span>
              </div>
              <div class="role" id="scopeShared" data-scope="shared">
                <b>대화방 공유</b>
                <span>선택한 상대와 함께 볼 수 있습니다</span>
              </div>
            </div>
            <div id="partnerBox" style="display:none">
              <label class="f" for="evPartner">함께 볼 상대</label>
              <select id="evPartner" style="width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff"></select>
            </div>
          </div>
          <button class="btn solid" id="evAdd" style="width:100%">캘린더에 저장</button>
        </div>
      </section>

      <section class="card">
        <h2><span id="dayTitle">선택한 날짜</span> <span class="tag" id="dayCount">0건</span></h2>
        <div class="evlist" id="evList"><div class="empty">날짜를 선택하세요</div></div>
      </section>
    </div>

  </div>
</div>

<script>
(function () {
  "use strict";
  var notice = document.getElementById("notice");
  var me = null;
  var friends = [];
  var events = [];
  var view = new Date();
  view.setDate(1);
  var selDate = new Date();
  var scope = "personal";

  function say(m, good) { notice.textContent = m; notice.className = "notice show " + (good ? "good" : "bad"); }
  function api(p, opts) {
    return fetch(p, opts).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); });
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  function hhmm(ts) { var d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function esc(s) {
    return (s == null ? "" : String(s)).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  document.getElementById("dowRow").innerHTML = ["일", "월", "화", "수", "목", "금", "토"]
    .map(function (d) { return '<div class="dow">' + d + "</div>"; }).join("");

  function monthRange() {
    var first = new Date(view.getFullYear(), view.getMonth(), 1);
    var gridStart = new Date(first);
    gridStart.setDate(1 - first.getDay());
    var gridEnd = new Date(gridStart);
    gridEnd.setDate(gridStart.getDate() + 42);
    return [gridStart, gridEnd];
  }

  function load() {
    var r = monthRange();
    api("/api/events?start=" + r[0].getTime() + "&end=" + r[1].getTime()).then(function (res) {
      if (res.j.code === "NOT_LOGGED_IN") { location.href = "/login"; return; }
      if (!res.j.ok) { say(res.j.detail || "일정을 불러오지 못했습니다", false); return; }
      events = res.j.events || [];
      drawMonth();
      drawDay();
      // 아직 수락하지 않은 초대는 캘린더에 넣지 않고, 어디서 수락하는지만 알린다
      api("/api/events/invites").then(function (iv) {
        var n = ((iv.j && iv.j.invites) || []).length;
        if (n) say("받은 공동 일정 초대 " + n + "건 · 대화 화면에서 수락할 수 있습니다", true);
      });
    });
  }

  function drawMonth() {
    var t = view.getFullYear() + "년 " + (view.getMonth() + 1) + "월";
    document.getElementById("mTitle").textContent = t;
    var r = monthRange(), gridStart = r[0];
    var todayKey = ymd(new Date()), selKey = ymd(selDate);
    var html = "";
    for (var i = 0; i < 42; i++) {
      var d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
      var k = ymd(d);
      var dayEv = events.filter(function (e) { return ymd(new Date(e.start_ts)) === k; });
      var cls = "daycell" + (d.getMonth() !== view.getMonth() ? " out" : "") +
                (k === todayKey ? " today" : "") + (k === selKey ? " sel" : "");
      html += '<div class="' + cls + '" data-date="' + k + '"><div class="dn">' + d.getDate() + "</div>";
      dayEv.slice(0, 3).forEach(function (e) {
        html += '<div class="ev ' + (e.scope === "shared" ? "shared" : "") + (e.mine ? "" : " other") + '">' +
          esc((e.mine ? "" : e.owner_name + " · ") + e.title) + "</div>";
      });
      if (dayEv.length > 3) html += '<div class="ev" style="background:transparent;border-left-color:transparent;color:var(--ink-4)">+' + (dayEv.length - 3) + "건</div>";
      html += "</div>";
    }
    document.getElementById("monthGrid").innerHTML = html;
  }

  function drawDay() {
    var k = ymd(selDate);
    var list = events.filter(function (e) { return ymd(new Date(e.start_ts)) === k; });
    var d = new Date(selDate.getFullYear(), selDate.getMonth(), selDate.getDate());
    var wd = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
    document.getElementById("dayTitle").textContent =
      d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + wd + "요일";
    document.getElementById("dayCount").textContent = list.length + "건";
    var box = document.getElementById("evList");
    if (!list.length) {
      box.innerHTML = '<div class="empty"><b>일정이 없습니다</b>왼쪽에서 이 날짜를 골라 추가할 수 있습니다</div>';
      return;
    }
    box.innerHTML = list.map(function (e) {
      var sub;
      if (e.scope === "shared") {
        sub = e.mine
          ? (e.status === "pending" ? "공동 일정 · 초대 보냄 (상대 수락 대기)" : "공동 일정 · 상대와 함께 보는 중")
          : e.owner_name + " 님의 공동 일정";
      } else {
        sub = "개인 일정";
      }
      sub += " · " + hhmm(e.start_ts) + (e.note ? " · " + esc(e.note) : "");
      return '<div class="evrow ' + (e.scope === "shared" ? "shared" : "") + '">' +
        '<div class="bar"></div><div><div class="t">' + esc(e.title) + '</div><div class="s">' + sub + "</div></div>" +
        (e.mine ? '<button class="x" data-del="' + e.id + '" title="삭제">✕</button>' : "<span></span>") +
        "</div>";
    }).join("");
  }

  document.getElementById("monthGrid").addEventListener("click", function (ev) {
    var cell = ev.target.closest(".daycell");
    if (!cell) return;
    var p = cell.dataset.date.split("-");
    selDate = new Date(+p[0], +p[1] - 1, +p[2]);
    document.getElementById("evDate").value = cell.dataset.date;
    drawMonth(); drawDay();
  });

  document.getElementById("evList").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-del]");
    if (!b) return;
    api("/api/events/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: +b.dataset.del }) })
      .then(function (res) {
        if (!res.j.ok) { say(res.j.detail || "삭제하지 못했습니다", false); return; }
        say("일정을 삭제했습니다", true); load();
      });
  });

  document.getElementById("prevM").addEventListener("click", function () { view.setMonth(view.getMonth() - 1); load(); });
  document.getElementById("nextM").addEventListener("click", function () { view.setMonth(view.getMonth() + 1); load(); });
  document.getElementById("todayBtn").addEventListener("click", function () {
    view = new Date(); view.setDate(1); selDate = new Date();
    document.getElementById("evDate").value = ymd(selDate);
    load();
  });

  function setScope(s) {
    scope = s;
    document.getElementById("scopePersonal").classList.toggle("on", s === "personal");
    document.getElementById("scopeShared").classList.toggle("on", s === "shared");
    document.getElementById("partnerBox").style.display = s === "shared" ? "block" : "none";
  }
  document.getElementById("scopePersonal").addEventListener("click", function () { setScope("personal"); });
  document.getElementById("scopeShared").addEventListener("click", function () { setScope("shared"); });

  document.getElementById("evAdd").addEventListener("click", function () {
    document.getElementById("e_title").textContent = "";
    var title = document.getElementById("evTitle").value.trim();
    var date = document.getElementById("evDate").value;
    var time = document.getElementById("evTime").value || "09:00";
    var note = document.getElementById("evNote").value.trim();
    if (!title) { document.getElementById("e_title").textContent = "제목을 입력하세요"; return; }
    if (!date) { say("날짜를 선택하세요", false); return; }
    var start = new Date(date + "T" + time + ":00").getTime();
    var body = { title: title, note: note, scope: scope, start_ts: start };
    if (scope === "shared") {
      var v = document.getElementById("evPartner").value;
      if (!v) { say("함께 볼 상대를 선택하세요", false); return; }
      body.with = +v;
    }
    api("/api/events", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (res) {
        if (!res.j.ok) { say(res.j.detail || "저장하지 못했습니다", false); return; }
        if (scope === "shared") {
          // 보낸 사람은 '제대로 보내졌는지'만 확인하면 된다 (상대 수락 여부는 묻지 않는다)
          say("공동 일정을 대화방으로 보냈습니다 · 상대가 수락하면 상대 캘린더에 등록됩니다", true);
        } else {
          say("내 캘린더에 저장했습니다 (나만 확인)", true);
        }
        document.getElementById("evTitle").value = "";
        document.getElementById("evNote").value = "";
        load();
      });
  });

  // 셸(대화 화면)에서 '수락함' 알림이 오면 이 화면을 다시 불러온다
  window.addEventListener("message", function (e) {
    if (e.data && e.data.fs === "calendar-refresh") load();
  });

  var loggedOut = false;
  document.getElementById("logout").addEventListener("click", function (ev) {
    ev.preventDefault();
    loggedOut = true;
    fetch("/api/logout", { method: "POST" }).then(function () { location.href = "/"; });
  });

  api("/api/friends").then(function (res) {
    if (!res.j.ok) { if (res.j.code === "NOT_LOGGED_IN") location.href = "/login"; return; }
    me = res.j.me;
    friends = res.j.friends || [];
    document.getElementById("mePill").textContent = me.role_label;
    document.getElementById("mePill").className = "pill " + me.role;
    document.getElementById("evPartner").innerHTML = friends.map(function (f) {
      return '<option value="' + f.id + '">' + esc(f.name) + " (" + esc(f.role_label) + ")</option>";
    }).join("") || '<option value="">친구가 없습니다</option>';
    if (!friends.length) setScope("personal");
    document.getElementById("evDate").value = ymd(selDate);
    load();
  }).catch(function () {
    document.getElementById("evDate").value = ymd(selDate);
    load();
  });
  window.addEventListener("beforeunload", function () { loggedOut = true; });
})();
</script>

<script>
/* 앱 셸 안에 끼워 넣을 때(embed=1)는 자체 상단바를 숨긴다 */
if (location.search.indexOf("embed=1") >= 0) {
  document.documentElement.classList.add("embedded");
  var st = document.createElement("style");
  st.textContent = ".embedded .topbar{display:none}.embedded .chatlayout,.embedded .wrap{height:100vh}" +
    ".embedded .chatlayout{height:100vh}.embedded .calwrap{padding-top:8px}";
  document.head.appendChild(st);
}
</script>

<script>
/* 느린 회선에서 화면이 '멈춘 것처럼' 보이지 않게 한다 ------------------------ */
(function () {
  var LIMIT = 7000;
  function mark(el, msg) {
    if (!el || el.getAttribute("data-slow")) return;
    el.setAttribute("data-slow", "1");
    el.innerHTML = msg;
  }
  setTimeout(function () {
    var stalled = false;
    [].forEach.call(document.querySelectorAll(".empty"), function (el) {
      if (/불러오는 중/.test(el.textContent || "")) {
        stalled = true;
        mark(el, "서버 응답이 늦어지고 있습니다. <a href=\"#\" id=\"slowRetry\"><b>다시 시도</b></a>");
      }
    });
    var r = document.getElementById("slowRetry");
    if (r) r.addEventListener("click", function (e) { e.preventDefault(); location.reload(); });
    [].forEach.call(document.querySelectorAll(".state, .pill, .tag, .status, .conn"), function (el) {
      if (/연결 중/.test((el.textContent || "").trim())) mark(el, "연결 지연 · 새로고침 필요");
    });
    if (stalled) console.warn("[farmsync] 초기 데이터 로드가 " + LIMIT + "ms 안에 끝나지 않았습니다");
  }, LIMIT);
})();
</script>
</body>
</html>
